# Deploy MkDocs site to GitHub Pages.
#
# After pushing this file, go to:
#   GitHub repo > Settings > Pages > Source
# and select "Deploy from a branch", branch: gh-pages, folder: / (root).
#
# The site will be available at https://<your-username>.github.io/specprism/

name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force
